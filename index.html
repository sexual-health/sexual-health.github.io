<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A World AIDS Day escape room</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#e9eff3;
  --panel:#ffffff;
  --panel-2:#f2f6f9;
  --ink:#12222d;
  --muted:#52626f;
  --line:#c9d6df;
  --sign:#12508f;
  --sign-ink:#ffffff;
  --sign-tint:#dbe8f5;
  --ribbon:#c8102e;
  --ribbon-ink:#ffffff;
  --ok:#17794a;
  --ok-bg:#e0f2e8;
  --bad:#a92f1a;
  --bad-bg:#fbe6e1;
  --font-head:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0c1822;
    --panel:#13232f;
    --panel-2:#192d3b;
    --ink:#e8f0f5;
    --muted:#9db0bd;
    --line:#2a4252;
    --sign:#2b72bd;
    --sign-ink:#ffffff;
    --sign-tint:#18344b;
    --ribbon:#ff3b58;
    --ribbon-ink:#ffffff;
    --ok:#62d697;
    --ok-bg:#12341f;
    --bad:#ff8f78;
    --bad-bg:#3a1c16;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0c1822;
  --panel:#13232f;
  --panel-2:#192d3b;
  --ink:#e8f0f5;
  --muted:#9db0bd;
  --line:#2a4252;
  --sign:#2b72bd;
  --sign-ink:#ffffff;
  --sign-tint:#18344b;
  --ribbon:#ff3b58;
  --ribbon-ink:#ffffff;
  --ok:#62d697;
  --ok-bg:#12341f;
  --bad:#ff8f78;
  --bad-bg:#3a1c16;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;min-height:100%;
  background:var(--bg);color:var(--ink);
  font-family:var(--font-body);font-size:1.0625rem;line-height:1.6;
  -webkit-text-size-adjust:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1,h2,h3{font-family:var(--font-head);line-height:1.12;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(2.2rem,6vw,3.6rem);font-weight:800}
h2{font-size:clamp(1.5rem,3.6vw,2.1rem);font-weight:800}
h3{font-size:1.15rem;font-weight:700}
p{margin:0 0 1em;max-width:68ch}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sign);outline-offset:2px}
:root[data-theme="dark"] :focus-visible{outline-color:#8ec0f5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) :focus-visible{outline-color:#8ec0f5}}

/* top bar */
.top{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1.2rem;
  padding:.65rem clamp(1rem,4vw,2rem);
}
.brand{display:flex;align-items:center;gap:.6rem;font-family:var(--font-head);font-weight:800;font-size:1.05rem}
.ribbon-mark{width:1.5rem;height:1.5rem;flex:none}
.stats{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem 1rem;margin-left:auto;font-size:.95rem;color:var(--muted)}
.stats strong{color:var(--ink);font-variant-numeric:tabular-nums}
.rack{display:flex;gap:.3rem}
.rack span{
  width:1.9rem;height:2.2rem;display:grid;place-items:center;
  border:2px dashed var(--line);border-radius:.35rem;
  font-family:var(--font-head);font-weight:800;font-size:1.15rem;color:var(--muted);
}
.rack span.on{border:2px solid var(--ribbon);background:var(--ribbon);color:var(--ribbon-ink)}
.hidden{display:none !important}

main{max-width:62rem;margin:0 auto;padding:clamp(1.25rem,4vw,2.5rem) clamp(1rem,4vw,2rem) 3rem}
main:focus{outline:none}

/* intro */
.hero{display:grid;gap:1.75rem;margin-bottom:2rem}
.hero .lede{font-size:1.2rem;max-width:56ch}
.signboard{
  background:var(--sign);color:var(--sign-ink);border-radius:.6rem;
  padding:clamp(1.25rem,4vw,2.25rem);
  border-left:.7rem solid var(--ribbon);
}
.signboard h1{margin-bottom:.35em}
.signboard p{margin-bottom:0;opacity:.95}
.rules{background:var(--panel);border:1px solid var(--line);border-radius:.6rem;padding:1.25rem 1.5rem}
.rules ul{margin:0;padding-left:1.25rem}
.rules li{margin:.35rem 0}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  background:var(--sign);color:var(--sign-ink);border:0;border-radius:.5rem;
  padding:.8rem 1.4rem;font-weight:700;font-size:1.05rem;min-height:2.9rem;
}
.btn:hover{filter:brightness(1.1)}
.btn.ribbon{background:var(--ribbon);color:var(--ribbon-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn[disabled]{opacity:.5;cursor:not-allowed;filter:none}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:.95rem}

/* corridor */
.corridor{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,19rem),1fr));gap:.9rem;margin:1.25rem 0 1.75rem}
.door{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:1rem;text-align:left;
  background:var(--panel);border:2px solid var(--line);border-radius:.6rem;padding:.8rem 1rem .8rem .8rem;
}
.door:hover{border-color:var(--sign)}
.plate{
  width:3.4rem;height:3.4rem;border-radius:.4rem;background:var(--sign);color:var(--sign-ink);
  display:grid;place-items:center;font-family:var(--font-head);font-weight:800;font-size:1.7rem;
}
.door .name{font-family:var(--font-head);font-weight:800;font-size:1.15rem;line-height:1.2;display:block}
.door .sub{color:var(--muted);font-size:.95rem;display:block}
.door .state{font-size:1.5rem;line-height:1}
.door.solved{border-color:var(--ok);background:var(--ok-bg)}
.door.locked{opacity:.6;cursor:not-allowed}
.door.locked:hover{border-color:var(--line)}
.door.next{border-color:var(--ribbon)}
.door.solved .plate{background:var(--ok);color:#fff}
:root[data-theme="dark"] .door.solved .plate{color:#06210f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .door.solved .plate{color:#06210f}}

.finale{
  display:flex;flex-wrap:wrap;align-items:center;gap:1rem 1.5rem;justify-content:space-between;
  background:var(--panel);border:2px solid var(--line);border-radius:.6rem;padding:1.1rem 1.4rem;
}
.finale p{margin:0}
.chat-head{display:flex;gap:1rem;align-items:center;margin-bottom:.8rem}
.chat-head h3{margin-bottom:.2rem}
.chat-head p{margin:0;color:var(--muted)}
.avatar{flex:none;width:5.5rem;height:5.5rem}
.avatar svg{display:block;width:100%;height:100%;border-radius:50%;border:2px solid var(--line)}
.log{display:grid;gap:.5rem;max-height:20rem;overflow:auto;padding:.7rem;background:var(--panel-2);border:1px solid var(--line);border-radius:.6rem}
.msg{display:flex}
.msg span{max-width:85%;padding:.5rem .85rem;border-radius:1rem;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.him span{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:.25rem}
.msg.me{justify-content:flex-end}
.msg.me span{background:var(--sign);color:var(--sign-ink);border-bottom-right-radius:.25rem}
.chat-input{display:flex;gap:.6rem;margin-top:.8rem}
.chat-input input{flex:1;min-width:0}
.chat-tools{display:flex;flex-wrap:wrap;gap:.6rem 1.2rem;align-items:center;margin-top:.7rem}
.tts{display:flex;gap:.45rem;align-items:center;font-size:.95rem}
.notice{margin:.8rem 0 0;font-size:.9rem;color:var(--muted);max-width:none}
.feedback{margin-top:.9rem;background:var(--sign-tint);border-left:.35rem solid var(--sign);border-radius:.3rem;padding:.7rem 1rem}
.feedback p{margin:.4rem 0 0}
.sorter{display:grid;gap:.8rem}
.sorter-help{margin:0 0 .7rem;color:var(--muted);font-size:.95rem;max-width:none}
.pile,.bin{border:2px dashed var(--line);border-radius:.6rem;padding:.7rem;background:var(--panel)}
.bin{border-style:solid}
.pile h4,.bin h4{margin:0 0 .5rem;font-family:var(--font-head);font-size:1.02rem}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:.8rem}
.bin{min-height:6rem}
.pile.waiting,.bin.waiting{border-color:var(--sign);cursor:pointer}
.pile.waiting:hover,.bin.waiting:hover{background:var(--sign-tint)}
.itemlist{display:flex;flex-direction:column;gap:.45rem}
.itemlist .empty{color:var(--muted);font-size:.9rem}
.pile .itemlist{flex-direction:row;flex-wrap:wrap}
.pile .sitem{padding:.4rem .7rem;font-size:.95rem}
.sitem{text-align:left;border:2px solid var(--line);background:var(--panel-2);border-radius:.5rem;padding:.5rem .75rem;font-weight:700;cursor:grab}
.sitem:hover:not([disabled]){border-color:var(--sign)}
.sitem.held{border-color:var(--ribbon);box-shadow:0 0 0 3px var(--bad-bg)}
.sitem[disabled]{cursor:default}
.bindrop{margin-top:.5rem;color:var(--sign);font-size:.9rem;font-weight:700}
.deckcard{display:grid;gap:.4rem;justify-items:center;text-align:center;background:var(--panel);border:3px solid var(--sign);border-radius:.8rem;padding:1.3rem 1rem;margin-bottom:.8rem;box-shadow:0 4px 0 var(--line)}
.deckcard strong{font-family:var(--font-head);font-size:1.35rem;line-height:1.25}
.deckcard small{color:var(--muted)}
.deckcard.done{border-color:var(--ok);background:var(--ok-bg)}
.deckbtns{display:flex;flex-wrap:wrap;gap:.6rem}
.deckbtns .btn{flex:1 1 12rem}
.deckcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:.8rem;margin-top:1rem}
.deckcol{border:2px solid var(--line);border-radius:.6rem;padding:.7rem;background:var(--panel)}
.deckcol h4{margin:0 0 .5rem;font-family:var(--font-head);font-size:1rem}
.sortrow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.5rem 1rem;padding:.6rem 0;border-top:1px solid var(--line)}
.sortrow:first-child{border-top:0}
.sl{flex:1 1 15rem;font-weight:700}
.sbins{display:flex;flex-wrap:wrap;gap:.4rem}
.sbtn{border:2px solid var(--line);background:var(--panel);border-radius:2rem;padding:.35rem .85rem;font-size:.95rem}
.sbtn:hover:not([disabled]){border-color:var(--sign)}
.sbtn.sel{border-color:var(--sign);background:var(--sign-tint);font-weight:700}
.padlock{display:flex;justify-content:center;gap:.7rem;padding:.6rem 0}
.dial{display:grid;gap:.35rem;justify-items:center}
.dbtn{width:3.2rem;height:2.5rem;border:2px solid var(--line);background:var(--panel);border-radius:.4rem;font-size:1rem}
.dbtn:hover:not([disabled]){border-color:var(--sign)}
.dig{width:3.2rem;text-align:center;font-family:var(--font-head);font-weight:800;font-size:2.2rem;line-height:1.3;background:var(--panel);border:2px solid var(--sign);border-radius:.4rem}
.cloze{line-height:2.6;max-width:none}
.cloze select{width:auto;max-width:100%;min-height:2.2rem;display:inline-block;margin:0 .2rem}
.spot{display:grid;grid-template-columns:repeat(auto-fit,minmax(10rem,1fr));gap:.6rem}
.spot-item{position:relative;display:grid;gap:.25rem;justify-items:center;text-align:center;background:var(--panel);border:2px solid var(--line);border-radius:.6rem;padding:.9rem .5rem .6rem}
.spot-item .em{font-size:2rem;line-height:1}
.spot-item .lab{font-size:.9rem;font-weight:700}
.spot-item .flagmark{position:absolute;top:.25rem;right:.4rem;font-size:1.1rem;min-width:1rem}
.spot-item:hover:not([disabled]){border-color:var(--sign)}
.spot-item.flag{border-color:var(--ribbon);background:var(--bad-bg)}
.spot-item[disabled]{cursor:default}
.textin{max-width:30rem}
.reviewbar{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;background:var(--sign-tint);border:1px solid var(--sign);border-radius:.6rem;padding:.7rem 1rem;margin-bottom:1rem}
.ind .hit td{background:var(--ok-bg);font-weight:700}
.ind td[colspan]{color:var(--muted);font-size:.9rem}
.tbox{--c:var(--sign);border-left:.45rem solid var(--c);background:var(--panel-2);background:color-mix(in srgb, var(--c) 11%, var(--panel));border-radius:.4rem;padding:.65rem 1rem;margin:.7rem 0}
.tbox h5{margin:0 0 .3rem;font-family:var(--font-head);font-size:1.05rem}
.tbox p{margin:.3rem 0 0;max-width:none}
.tbox.gold{--c:#a67c00}.tbox.slate{--c:#455a64}
.dot{display:inline-block;width:.9rem;height:.9rem;border-radius:50%;margin-right:.5rem;vertical-align:-.1rem;border:1px solid rgba(0,0,0,.25)}
.dot.r{background:#d32f2f}.dot.a{background:#ff8f00}.dot.y{background:#fdd835}.dot.g{background:#2e7d32}
.tbox.hiv{--c:#c8102e}.tbox.pres{--c:#1565c0}.tbox.img{--c:#6a1b9a}.tbox.dx{--c:#00838f}.tbox.rx{--c:#2e7d32}.tbox.steroid{--c:#e65100}
.callout{border-left:.35rem solid var(--sign);background:var(--sign-tint);border-radius:.3rem;padding:.7rem 1rem;margin-top:1rem}
.callout h4{margin:0 0 .3rem}
.callout p{margin:0}
.solved-box h4{font-family:var(--font-head);margin:1rem 0 .4rem}
.wa{--wa-head:#075e54;--wa-bg:#e7ded4;--wa-bubble:#ffffff;--wa-ink:#111b21;--wa-time:#667781;border-radius:.6rem;overflow:hidden;max-width:26rem;border:1px solid var(--line)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .wa{--wa-head:#1f2c34;--wa-bg:#0b141a;--wa-bubble:#202c33;--wa-ink:#e9edef;--wa-time:#8696a0}}
:root[data-theme="dark"] .wa{--wa-head:#1f2c34;--wa-bg:#0b141a;--wa-bubble:#202c33;--wa-ink:#e9edef;--wa-time:#8696a0}
.wa-head{display:flex;align-items:center;gap:.7rem;background:var(--wa-head);color:#fff;padding:.55rem .8rem}
.wa-av{display:grid;place-items:center;width:2.2rem;height:2.2rem;border-radius:50%;background:rgba(255,255,255,.22);font-size:1.1rem;flex:none}
.wa-title{display:grid;line-height:1.2;min-width:0}
.wa-title small{opacity:.8;font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wa-body{background:var(--wa-bg);padding:.8rem .7rem;display:grid;gap:.45rem}
.wa-msg{justify-self:start;max-width:88%;background:var(--wa-bubble);color:var(--wa-ink);border-radius:.15rem .6rem .6rem .6rem;padding:.35rem .6rem .3rem;display:grid;box-shadow:0 1px 1px rgba(0,0,0,.13)}
.wa-name{font-size:.8rem;font-weight:700}
.wa-name.c1{color:#c2185b}.wa-name.c2{color:#00897b}.wa-name.c3{color:#e65100}.wa-name.c4{color:#5e35b1}.wa-name.c5{color:#1565c0}
:root[data-theme="dark"] .wa-name.c1{color:#ff80ab}:root[data-theme="dark"] .wa-name.c2{color:#4db6ac}:root[data-theme="dark"] .wa-name.c3{color:#ffab40}:root[data-theme="dark"] .wa-name.c4{color:#b39ddb}:root[data-theme="dark"] .wa-name.c5{color:#64b5f6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .wa-name.c1{color:#ff80ab}:root:not([data-theme="light"]) .wa-name.c2{color:#4db6ac}:root:not([data-theme="light"]) .wa-name.c3{color:#ffab40}:root:not([data-theme="light"]) .wa-name.c4{color:#b39ddb}:root:not([data-theme="light"]) .wa-name.c5{color:#64b5f6}}
.wa-text{font-size:.98rem;line-height:1.35}
.wa-time{justify-self:end;font-size:.7rem;color:var(--wa-time);margin-top:.1rem}
.chartcard{background:var(--panel);border:2px solid var(--line);border-radius:.6rem;padding:.7rem .9rem;margin:0 0 .9rem}
.chartcard .labs{margin-top:.4rem;min-width:0}
.resetrow{text-align:right;margin-top:.5rem}
.resetrow .linkbtn{font-size:.85rem}
.teamrow{margin:.2rem 0 .8rem}
.teamrow label{display:block;margin-bottom:.3rem}
.teamin{font:inherit;padding:.6rem .8rem;border:2px solid var(--line);border-radius:.5rem;min-width:14rem;max-width:100%;background:var(--panel);color:var(--ink)}
.resultsbox{width:100%;font:inherit;font-size:.9rem;padding:.6rem .8rem;border:2px solid var(--line);border-radius:.5rem;background:var(--panel);color:var(--ink);resize:vertical}
.audioq{margin:0 0 .9rem}
.audioq details{margin-top:.6rem}
.scroll{overflow-x:auto;margin:.5rem 0 0}
.phone{max-width:19rem;background:#f2f2f7;color:#111;border:.5rem solid #2b2b2b;border-radius:1.6rem;overflow:hidden;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.phone-top{display:flex;align-items:center;gap:.6rem;background:#e9e9ee;border-bottom:1px solid #cfcfd6;padding:.55rem .8rem}
.phone-av{display:grid;place-items:center;width:2rem;height:2rem;border-radius:50%;background:#8e8e93;color:#fff;font-weight:700}
.phone-name{display:grid;line-height:1.15}
.phone-name small{color:#6b6b73;font-size:.75rem}
.phone-body{padding:.7rem .8rem 1rem;display:grid;gap:.4rem}
.sms-time{text-align:center;color:#8e8e93;font-size:.72rem}
.sms.sent{justify-self:end;background:#1e88e5;color:#fff;border-radius:1.1rem 1.1rem .25rem 1.1rem}
.sms{justify-self:start;max-width:92%;background:#dcdce2;color:#111;border-radius:1.1rem 1.1rem 1.1rem .25rem;padding:.55rem .8rem;line-height:1.35;font-size:.98rem}
.labs{width:100%;border-collapse:collapse;font-size:.95rem;min-width:19rem}
.labs th,.labs td{text-align:left;padding:.3rem .6rem;border-bottom:1px solid var(--line)}
.labs th{font-family:var(--font-head);font-weight:700}
.labs td.hi{color:var(--bad);font-weight:700}
.labs td.lo{color:var(--sign);font-weight:700}
:root[data-theme="dark"] .labs td.lo{color:#8ec0f5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .labs td.lo{color:#8ec0f5}}
.xray{margin:1rem 0;max-width:24rem}
.xray img{display:block;width:100%;height:auto;border-radius:.5rem;border:1px solid var(--line)}
.xray svg{display:block;width:100%;height:auto;border-radius:.5rem;border:1px solid var(--line);background:#08080a}
.xray figcaption{font-size:.9rem;color:var(--muted);margin-top:.4rem;max-width:none}
.patient{background:var(--panel);border:1px solid var(--line);border-left:.45rem solid var(--ribbon);border-radius:.6rem;padding:1rem 1.25rem}
.patient p{margin:.25rem 0 0}
.story{margin:.7rem 0 0;padding-left:1.2rem;color:var(--ok);font-weight:700}
.story li{margin:.2rem 0}
a{color:var(--sign);font-weight:700}
:root[data-theme="dark"] a{color:#8ec0f5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) a{color:#8ec0f5}}
.finale.ready{border-color:var(--ribbon)}

/* room */
.crumb{margin-bottom:1rem}
.room-head{display:flex;gap:1.1rem;align-items:center;margin-bottom:1.25rem}
.room-head .plate{width:4.2rem;height:4.2rem;font-size:2.2rem;flex:none}
.room-head h2{margin:0}
.room-head .sub{color:var(--muted);margin:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:.6rem;padding:1.25rem 1.4rem;margin-bottom:1.25rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:.7rem;margin:.75rem 0}
.tile{
  display:grid;gap:.25rem;justify-items:center;text-align:center;
  background:var(--panel-2);border:2px solid var(--line);border-radius:.6rem;padding:.9rem .5rem;
}
.tile .em{font-size:2.3rem;line-height:1}
.tile .lab{font-size:.95rem;font-weight:700}
.tile:hover{border-color:var(--sign)}
.tile.on{border-color:var(--sign);background:var(--sign-tint)}
.tile.seen .lab::after{content:" ✓";color:var(--ok)}
.clue{
  min-height:3.5rem;background:var(--sign-tint);border-left:.35rem solid var(--sign);
  border-radius:.3rem;padding:.8rem 1rem;margin-top:.5rem;
}
.clue p{margin:0}
.clue.empty{background:transparent;border-left-color:var(--line);color:var(--muted)}

.stage{border:2px solid var(--line);border-radius:.6rem;padding:1rem 1.1rem;margin:0 0 1rem;background:var(--panel-2)}
.stage.ok{border-color:var(--ok)}
.stage.bad{border-color:var(--bad);background:var(--bad-bg)}
.stage h3{margin-bottom:.7rem}
.stage-note{margin:.6rem 0 0;font-weight:700;color:var(--bad)}
.stage.ok .stage-note{color:var(--ok)}
.opts{display:grid;gap:.5rem}
.opt{
  text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:.5rem;
  padding:.65rem .9rem;display:flex;gap:.7rem;align-items:flex-start;min-height:2.8rem;
}
.opt:hover:not([disabled]){border-color:var(--sign)}
.opt .box{
  flex:none;width:1.2rem;height:1.2rem;margin-top:.2rem;border:2px solid var(--muted);border-radius:50%;
}
.opt.multi .box{border-radius:.25rem}
.opt.sel{border-color:var(--sign);background:var(--sign-tint)}
.opt.sel .box{background:var(--sign);border-color:var(--sign);box-shadow:inset 0 0 0 3px var(--sign-tint)}
.opt[disabled]{cursor:default}
.seq{display:grid;gap:.4rem;margin:.2rem 0 .8rem;counter-reset:s}
.seq .slot{
  display:flex;align-items:center;gap:.7rem;min-height:2.6rem;
  border:2px dashed var(--line);border-radius:.5rem;padding:.4rem .8rem;background:var(--panel);
}
.seq .slot.fill{border-style:solid;border-color:var(--sign);background:var(--sign-tint)}
.seq .n{font-family:var(--font-head);font-weight:800;width:1.5rem;color:var(--muted)}
.pool{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:.6rem}
.chip{background:var(--panel);border:2px solid var(--line);border-radius:2rem;padding:.45rem .95rem}
.chip:hover:not([disabled]){border-color:var(--sign)}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:.5rem 1rem;align-items:center;padding:.5rem 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row label{font-weight:700}
select,input[type=number],input[type=text]{
  width:100%;min-height:2.7rem;padding:.45rem .7rem;border:2px solid var(--line);border-radius:.5rem;background:var(--panel);
}
@media (max-width:34rem){.row{grid-template-columns:1fr}}
.actions{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center;margin-top:1rem}
.fb{margin:.9rem 0 0;font-weight:700;min-height:1.5rem}
.fb.bad{color:var(--bad)}
.hints{margin-top:1rem;border-top:1px solid var(--line);padding-top:.9rem}
.hint{background:var(--panel-2);border-left:.35rem solid var(--ribbon);padding:.55rem .9rem;border-radius:.3rem;margin:.5rem 0}

.win-letter{
  display:inline-grid;place-items:center;width:4.6rem;height:5.4rem;border-radius:.5rem;
  background:var(--ribbon);color:var(--ribbon-ink);font-family:var(--font-head);font-weight:800;font-size:3rem;
  animation:stamp .5s cubic-bezier(.2,.9,.3,1.2) both;
}
@keyframes stamp{from{transform:scale(1.8) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.win-letter{animation:none}}
.solved-box{display:flex;flex-wrap:wrap;gap:1.2rem;align-items:center}
.solved-box .txt{flex:1 1 18rem;min-width:0}
.solved-box .txt p{margin-bottom:.6rem}
.badge{display:inline-block;background:var(--ok-bg);color:var(--ok);font-weight:700;border-radius:2rem;padding:.15rem .8rem;margin-bottom:.6rem}

/* door */
.letters{display:flex;flex-wrap:wrap;gap:.7rem;margin:1rem 0 1.4rem}
.ltile{display:grid;justify-items:center;gap:.2rem;font-size:.85rem;color:var(--muted)}
.ltile b{
  display:grid;place-items:center;width:3.4rem;height:4rem;border-radius:.45rem;
  background:var(--ribbon);color:var(--ribbon-ink);font-family:var(--font-head);font-size:2.1rem;font-weight:800;
}
.codein{max-width:22rem;font-family:var(--font-head);font-weight:800;font-size:1.8rem;letter-spacing:.35em;text-transform:uppercase;text-align:center}
details{background:var(--panel);border:1px solid var(--line);border-radius:.5rem;padding:.6rem 1rem;margin:.5rem 0}
summary{cursor:pointer;font-weight:700}
details p{margin:.6rem 0 0}
.stat-row{display:flex;flex-wrap:wrap;gap:1rem;margin:1rem 0 1.5rem}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:.6rem;padding:.8rem 1.2rem}
.stat b{display:block;font-family:var(--font-head);font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums}

footer{max-width:62rem;margin:0 auto;padding:0 clamp(1rem,4vw,2rem) 2rem;color:var(--muted);font-size:.95rem}
.overlay{position:fixed;inset:0;background:rgba(5,12,18,.7);z-index:50;display:grid;place-items:center;padding:1rem}
.modal{background:var(--panel);color:var(--ink);border-radius:.7rem;max-width:42rem;width:100%;max-height:85vh;overflow:auto;padding:1.4rem 1.6rem}
.modal li{margin:.5rem 0}
</style>
</head>

      <div class="tbox rx"><h5>💊 Treatment for 21 days</h5><p><strong>Moderate-to-severe</strong> (PaO₂ 9.3 kPa or less on air): <strong>intravenous co-trimoxazole 120 mg/kg/day</strong> in three or four divided doses, switching to oral later.</p><p><strong>Mild-to-moderate:</strong> oral co-trimoxazole, for example 960 mg three times daily.</p><p><strong>Alternatives</strong> (clindamycin with primaquine, dapsone with trimethoprim, atovaquone, intravenous pentamidine) are used when co-trimoxazole cannot be used.</p></div>

      <p>Pneumocystis pneumonia is an AIDS-defining condition. Read the guideline: <a href="https://bhiva.org/wp-content/uploads/2024/10/OI-guidelines-Pulmonary.pdf" target="_blank" rel="noopener noreferrer">BHIVA guidelines on the management of opportunistic infection in people living with HIV: the clinical management of pulmonary opportunistic infections 2024</a>.</p>`,

      <div class="tbox img"><h5>🧬 HIV is not the same as AIDS</h5><p>HIV is the <strong>virus</strong>. AIDS is the <strong>advanced stage</strong>, and is largely preventable with early diagnosis and treatment.</p></div>

      <div class="tbox hiv"><h5>⚠️ Why finding people earlier matters</h5><p>In England in 2023, adults diagnosed late with HIV were <strong>ten times more likely to die within a year</strong> of diagnosis than adults diagnosed promptly.</p><p>This is why finding people earlier through testing matters.</p></div>
      <div class="tbox gold"><h5>🌍 Stigma, discrimination and punitive laws</h5><p>UNAIDS’ World AIDS Day 2026 page says stigma, discrimination and punitive laws <strong>keep people from services</strong>.</p><p>Across 36 countries, <strong>50%</strong> of adults hold discriminatory attitudes towards people living with HIV.</p><p>Among people living with HIV who sought non-HIV health care across 25 countries, <strong>25%</strong> reported stigma or discrimination and <strong>12%</strong> were denied care entirely.</p><p>Read more: <a href="https://www.unaids.org/en/2026-world-aids-day" target="_blank" rel="noopener noreferrer">UNAIDS World AIDS Day 2026 page</a>.</p></div>
      <div class="tbox slate"><h5>📜 HIV milestones</h5><p><strong>1981</strong> AIDS first recognised</p><p><strong>1983</strong> the virus identified</p><p><strong>1996</strong> combination therapy transformed outcomes</p><p><strong>2016</strong> the PARTNER study reported. It followed serodifferent couples in which the partner with HIV was on virally suppressive treatment (HIV viral load <strong>below 200 copies/mL</strong>) and the other partner did not have HIV. In PARTNER1, across 888 couples (548 heterosexual and 340 gay), there were 1,238 eligible couple-years of follow-up and <strong>no phylogenetically linked transmissions</strong>.</p><p><strong>2019</strong> PARTNER2 followed 782 gay couples for 1,593 eligible couple-years, including 76,088 reported episodes of condomless sex, and again found <strong>no phylogenetically linked within-couple transmissions</strong>. BHIVA concludes that the risk of HIV transmission through condomless sex from a person on suppressive treatment is effectively zero: this is U=U.</p><p><strong>2025</strong> HIV Action Plan for England 2025 to 2030 published</p></div>`,

      <div class="tbox rx"><h5>🛡️ U=U</h5><p>Once the viral load has been sustained <strong>below 200 copies/mL</strong> (usually confirmed over about <strong>6 months</strong>, with excellent adherence), HIV <strong>cannot be passed on sexually</strong>.</p><p>BHIVA recommends clear wording: <strong>“no risk”</strong> or <strong>“zero risk”</strong> of sexual transmission, not “negligible” or “minimal”. U=U depends on a <strong>sustained</strong> undetectable viral load and excellent adherence to treatment.</p><p>It prevents HIV transmission to <strong>sexual partners only</strong>. Condoms also help prevent other STIs and pregnancy. Pregnancy and infant feeding need shared decisions with specialist support.</p><p>Read the statement: <a href="https://bhiva.org/bhiva-encourages-universal-promotion-of-u-u/" target="_blank" rel="noopener noreferrer">BHIVA encourages universal promotion of U=U</a>.</p></div>

/* ---------- State ---------- */
let st;
let timerId = null;
let TTS = null, COMMENTS = null;

function shuffle(a) {
  const b = a.slice();
  for (let i = b.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
}

function prepareOrders() {
  ROOMS.forEach(r => r.stages.forEach(s => {
    const n = (s.type === "order" || s.type === "spot" || s.type === "sort" || s.type === "deck") ? s.items.length : (s.options ? s.options.length : 0);
    if (s.type === "mcq" || s.type === "multi" || s.type === "order" || s.type === "spot" || s.type === "sort" || s.type === "deck") {
      const idx = Array.from({ length: n }, (_, i) => i);
      let o = s.fixedOrder ? idx : shuffle(idx);
      if (s.type === "order") {
        let guard = 0;
        while (o.every((v, i) => v === i) && guard++ < 20) o = shuffle(idx);
      }
      s._order = o;
    }
  }));
}

function resetState() {
  st = {
    screen: "intro", roomId: null, started: false, startTime: 0, elapsed: 0, finished: false,
    solved: {}, inp: {}, res: {}, msg: {}, clue: {}, seen: {}, hintsShown: {}, hints: 0, attempts: 0, doorMsg: "",
    team: "", wrong: {}, resets: {}, roomDone: {}, sent: ""
  };
  prepareOrders();
}

/* ---------- Helpers ---------- */
const app = document.getElementById("app");
const roomById = id => ROOMS.find(r => r.id === id);
const isUnlocked = id => !!st.review || id === 1 || !!st.solved[id - 1];
const solvedCount = () => Object.keys(st.solved).length;
const fmt = sec => String(Math.floor(sec / 60)).padStart(2, "0") + ":" + String(sec % 60).padStart(2, "0");

function getVal(rid, si, s) {
  const store = st.inp[rid] || (st.inp[rid] = {});
  if (store[si] === undefined) {
    store[si] = s.type === "mcq" ? null
      : (s.type === "multi" || s.type === "order" || s.type === "spot") ? []
      : s.type === "text" ? ""
      : (s.type === "sort" || s.type === "deck") ? s.items.map(() => null)
      : s.type === "padlock" ? Array.from({ length: s.digits }, () => 0)
      : s.type === "cloze" ? s.blanks.map(() => null)
      : s.type === "match" ? s.rows.map(() => null)
      : s.fields.map(() => "");
  }
  return store[si];
}
function setVal(rid, si, v) { (st.inp[rid] || (st.inp[rid] = {}))[si] = v; }

function checkStage(s, v) {
  switch (s.type) {
    case "mcq": return v === s.answer;
    case "multi": return v.length === s.answers.length && s.answers.every(a => v.includes(a));
    case "order": return v.length === s.items.length && v.every((x, i) => x === i);
    case "match": return s.rows.every((r, i) => v[i] === r.answer);
    case "spot": {
      const want = s.items.map((it, i) => (it.problem ? i : -1)).filter(i => i >= 0);
      return v.length === want.length && want.every(i => v.includes(i));
    }
    case "sort": case "deck": return s.items.every((it, i) => v[i] === it.bin);
    case "padlock": return v.join("") === String(s.answer);
    case "cloze": return s.blanks.every((b, i) => v[i] === b.answer);
    case "text": {
      const n = String(v || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
      if (s.anyOf) return s.anyOf.some(w => n.includes(w));
      return (s.mustInclude || []).length > 0 && s.mustInclude.every(w => n.includes(w));
    }
    case "num": return s.fields.every((f, i) => v[i] !== "" && Math.abs(parseFloat(v[i]) - f.answer) <= (f.tol || 0));
  }
  return false;
}

/* ---------- Timer & header ---------- */
function startTimer() {
  st.started = true;
  st.startTime = Date.now();
  clearInterval(timerId);
  timerId = setInterval(() => {
    if (st.finished) return;
    st.elapsed = Math.floor((Date.now() - st.startTime) / 1000);
    const t = document.getElementById("timer");
    if (t) t.textContent = fmt(st.elapsed);
  }, 1000);
  document.getElementById("stats").classList.remove("hidden");
  updateHeader();
}
function updateHeader() {
  document.getElementById("hintcount").textContent = st.hints;
  document.getElementById("roomcount").textContent = solvedCount();
  document.getElementById("timer").textContent = fmt(st.elapsed);
  const rack = document.getElementById("rack");
  let html = "";
  for (let p = 1; p <= ROOMS.length; p++) {
    const r = ROOMS.find(x => x.pos === p);
    const on = st.solved[r.id];
    html += `<span class="${on ? "on" : ""}" title="Character ${p}">${on ? r.letter : "·"}</span>`;
  }
  rack.innerHTML = html;
}

    <path d="M47 89L60 106L73 89" fill="none" stroke="#6f97c2" stroke-width="3" stroke-linejoin="round"/>
    <rect x="52" y="74" width="16" height="18" rx="6" fill="#cf9c76"/>
    <ellipse cx="36" cy="57" rx="4" ry="7" fill="#d6a47e"/><ellipse cx="84" cy="57" rx="4" ry="7" fill="#d6a47e"/>
    <ellipse cx="60" cy="54" rx="24" ry="28" fill="#e2b48f"/>
    <path d="M35 52Q32 22 60 21Q88 22 85 52Q81 35 60 34Q39 35 35 52Z" fill="#2c2622"/>
    <ellipse cx="37.5" cy="45" rx="2.6" ry="6" fill="#9a9aa0"/><ellipse cx="82.5" cy="45" rx="2.6" ry="6" fill="#9a9aa0"/>
    <ellipse cx="50" cy="55" rx="5.6" ry="${eyeR}" fill="#fff"/><ellipse cx="70" cy="55" rx="5.6" ry="${eyeR}" fill="#fff"/>
    <circle cx="50" cy="55.5" r="2.4" fill="#2a2a2a"/><circle cx="70" cy="55.5" r="2.4" fill="#2a2a2a"/>

    <path d="M60 57Q57 65 60 67" fill="none" stroke="#b9825e" stroke-width="1.7" stroke-linecap="round"/>
    ${mouth}
  </svg>`;
}

function recordingPanelHTML(r) {
  if (r.id !== RECORDING.roomId) return "";
  const busy = SPEAK_STATE !== "idle";
  const control = TTS
    ? (busy
      ? `<button type="button" class="btn ghost" data-act="stop-rec">■ Stop</button>`
      : `<button type="button" class="btn ribbon" data-act="play-rec">▶ Play recording</button>`)
    : `<p class="notice" style="margin:0">Audio is not available in this view, so read the transcript below.</p>`;
  return `
    <div class="panel recording" id="recpanel">
      <div class="chat-head"><div class="avatar">${avatarSVG(RECORDING.mood)}</div><div><h3>${RECORDING.title}</h3><p>${RECORDING.task}</p></div></div>
      <div class="actions" style="margin-top:0">${control}</div>
      <div class="clue" style="margin-top:.8rem"><p><strong>Transcript:</strong> ${esc(RECORDING.text)}</p></div>
      <p class="notice">A scripted summary, not a real patient.</p>
    </div>`;
}

function refreshRecording() {
  if (st.screen !== "room") return;
  const el = document.getElementById("recpanel");
  if (!el) return;
  el.outerHTML = recordingPanelHTML(roomById(st.roomId));
}

function playRecording() {
  if (!TTS) return;
  TTS.speak(RECORDING.audioSrc).catch(() => {});
}

function stopRecording() {
  if (TTS) TTS.stop().catch(() => {});
}

/* ---------- Views ---------- */
function introView() {
  return `
  <section class="hero">
    <div>
      <p class="lede">A power cut has locked every door on the hospital’s medical wards, and you need to help. Work through eight rooms, from the acute medical unit to discharge, to get your patient safely home. Each room gives one character of the eight-character override code, and the place it belongs in.</p>
      <div class="patient"><strong>${PATIENT.title}</strong><p>${PATIENT.summary}</p></div>
    </div>
    <div class="rules">
      <h3>How to play</h3>
      <ul>
        <li>Rooms open in order. You cannot move on to the next room until you have solved the one you are in.</li>
        <li>In each room, tap the objects for clues, then answer the lock questions.</li>
        <li>Hints are free but counted. The fastest team with the fewest hints wins.</li>
      </ul>
    </div>
    <div class="teamrow"><label for="teamname"><strong>Team name</strong>${REQUIRE_TEAM ? " (required)" : " (optional)"}</label><input id="teamname" class="teamin" type="text" maxlength="30" autocomplete="off" placeholder="For example Team Red"><p class="notice">Use a team name, not personal names. <span id="teamerr" role="alert"></span></p></div>
    <div><button class="btn ribbon" type="button" data-act="begin">Start the clock</button></div>
  </section>`;
}

function hubView() {
  const n = solvedCount();
  const all = n === ROOMS.length;
  const done = ROOMS.filter(r => st.solved[r.id]);
  const story = done.length ? `<ul class="story">${done.map(r => [].concat(r.story).map(t => `<li>${t}</li>`).join("")).join("")}</ul>` : "";
  const nextId = (ROOMS.find(r => !st.solved[r.id]) || {}).id;
  const doors = ROOMS.map(r => {
    const locked = !isUnlocked(r.id);
    const solved = !!st.solved[r.id];
    return `
    <button type="button" class="door ${solved ? "solved" : ""} ${locked ? "locked" : ""} ${r.id === nextId ? "next" : ""}" data-act="open" data-r="${r.id}" ${locked ? "disabled" : ""}>
      <span class="plate" aria-hidden="true">${r.id}</span>
      <span><span class="name">${r.name}</span><span class="sub">${solved ? "Solved: character " + r.letter : locked ? "Locked: solve room " + (r.id - 1) + " first" : r.sub}</span></span>
      <span class="state" aria-hidden="true">${solved ? "✅" : locked ? "🔒" : r.icon}</span>
    </button>`;
  }).join("");
  return `
    <div class="patient"><strong>${PATIENT.title}</strong><p>${PATIENT.summary}</p>${story}</div>
    <h2>The corridor</h2>
    <p>${all ? "All eight characters are in. The final door is unlocked." : "Eight doors, eight characters. Solve each room to unlock the next. " + n + " of 8 rooms solved."}</p>
    ${st.review ? `<p class="notice">Review mode is on: all rooms are unlocked. Open any room and press “Show correct answers” to see every question answered and the teaching note, without answering anything. Nothing you do in review mode is saved.</p>` : ""}
    <div class="corridor">${doors}</div>
    <div class="finale ${all ? "ready" : ""}">
      <p><strong>Final door</strong><br>${all ? "Put the characters in order and type the override code." : "Locked until every room is solved."}</p>
      <button type="button" class="btn ribbon" data-act="door" ${all || st.review ? "" : "disabled"}>Try the final door</button>
    </div>`;
}

function stageHTML(r, si) {
  const s = r.stages[si];
  const v = getVal(r.id, si, s);
  const solved = !!st.solved[r.id];
  const res = st.res[r.id] ? st.res[r.id][si] : null;
  const cls = solved || res === true ? "ok" : res === false ? "bad" : "";
  const dis = solved ? "disabled" : "";
  let body = "";
  if (s.type === "mcq") {
    body = `<div class="opts">` + s._order.map(i => `
      <button type="button" class="opt ${v === i ? "sel" : ""}" ${dis} data-act="mcq" data-r="${r.id}" data-s="${si}" data-i="${i}" aria-pressed="${v === i}">
        <span class="box"></span><span>${s.options[i]}</span></button>`).join("") + `</div>`;
  } else if (s.type === "multi") {
    body = `<div class="opts">` + s._order.map(i => {
      const on = v.includes(i);
      return `<button type="button" class="opt multi ${on ? "sel" : ""}" ${dis} data-act="multi" data-r="${r.id}" data-s="${si}" data-i="${i}" aria-pressed="${on}">
        <span class="box"></span><span>${s.options[i]}</span></button>`;
    }).join("") + `</div>`;
  } else if (s.type === "order") {
    const slots = s.items.map((_, k) => `
      <div class="slot ${v[k] !== undefined ? "fill" : ""}"><span class="n">${k + 1}</span><span>${v[k] !== undefined ? s.items[v[k]] : ""}</span></div>`).join("");
    const pool = s._order.filter(i => !v.includes(i)).map(i =>
      `<button type="button" class="chip" ${dis} data-act="ord-add" data-r="${r.id}" data-s="${si}" data-i="${i}">${s.items[i]}</button>`).join("");
    body = `<div class="seq">${slots}</div><div class="pool">${pool}</div>
      <div class="actions" style="margin-top:0">
        <button type="button" class="btn ghost" ${dis} data-act="ord-undo" data-r="${r.id}" data-s="${si}">Undo last</button>
        <button type="button" class="btn ghost" ${dis} data-act="ord-reset" data-r="${r.id}" data-s="${si}">Start again</button>
      </div>`;
  } else if (s.type === "match") {
    body = s.rows.map((row, k) => `
      <div class="row"><label for="m-${r.id}-${si}-${k}">${row.label}</label>
        <select id="m-${r.id}-${si}-${k}" ${dis} data-act="match" data-r="${r.id}" data-s="${si}" data-k="${k}">
          <option value="">Choose…</option>
          ${s.options.map((o, i) => `<option value="${i}" ${v[k] === i ? "selected" : ""}>${o}</option>`).join("")}
        </select></div>`).join("");
  } else if (s.type === "spot") {
    body = `<div class="spot">` + s._order.map(i => {
      const on = v.includes(i);
      return `<button type="button" class="spot-item ${on ? "flag" : ""}" ${dis} data-act="spot" data-r="${r.id}" data-s="${si}" data-i="${i}" aria-pressed="${on}">
        <span class="flagmark" aria-hidden="true">${on ? "🚩" : ""}</span><span class="em" aria-hidden="true">${s.items[i].icon}</span><span class="lab">${s.items[i].label}</span></button>`;
    }).join("") + `</div>`;
  } else if (s.type === "deck") {
    const order = s._order;
    const cur = order.find(i => v[i] === null);
    const doneCount = order.filter(i => v[i] !== null).length;
    const card = cur === undefined
      ? `<div class="deckcard done"><strong>All ${s.items.length} cards are sorted.</strong><small>Press Try the lock, or tap a card in a column to take it back.</small></div>`
      : `<div class="deckcard"><small>Card ${doneCount + 1} of ${s.items.length}</small><strong>${s.items[cur].label}</strong></div>
         <div class="deckbtns">${s.bins.map((bn, b) => `<button type="button" class="btn ghost" ${dis} data-act="deck" data-r="${r.id}" data-s="${si}" data-k="${cur}" data-b="${b}">${bn}</button>`).join("")}</div>`;
    const cols = s.bins.map((bn, b) => `<div class="deckcol"><h4>${bn}</h4><div class="itemlist">${
      order.filter(i => v[i] === b).map(i => `<button type="button" class="sitem" ${dis} data-act="deck-undo" data-r="${r.id}" data-s="${si}" data-k="${i}">${s.items[i].label}</button>`).join("") || `<span class="empty">Nothing here yet</span>`
    }</div></div>`).join("");
    body = card + `<div class="deckcols">${cols}</div>`;
  } else if (s.type === "sort") {
    const held = (st.hold && st.hold.r === r.id && st.hold.s === si) ? st.hold.i : null;
    const chip = i => `<button type="button" class="sitem ${held === i ? "held" : ""}" draggable="${solved ? "false" : "true"}" ${dis} data-act="sort-pick" data-r="${r.id}" data-s="${si}" data-i="${i}" aria-pressed="${held === i}">${s.items[i].label}</button>`;
    const pile = s._order.filter(i => v[i] === null).map(chip).join("");
    const zone = (b, title, list) => `<div class="${b < 0 ? "pile" : "bin"} ${held !== null ? "waiting" : ""}" data-act="sort-drop" data-r="${r.id}" data-s="${si}" data-b="${b}" role="group" aria-label="${esc(title)}">
        <h4>${title}</h4>
        <div class="itemlist">${list || `<span class="empty">${b < 0 ? "All sorted" : "Nothing here yet"}</span>`}</div>
        ${held !== null && !solved ? `<div class="bindrop">Tap here to move the held item ${b < 0 ? "back to the pile" : "into this column"}</div>` : ""}
      </div>`;
    body = `<p class="sorter-help">Tap an item to pick it up, then tap the column heading or box where it belongs. You can also drag and drop. Tap a placed item to move it again.</p>
      <div class="sorter">` + zone(-1, "Items to sort", pile) +
      `<div class="bins">` + s.bins.map((bn, b) => zone(b, bn, s._order.filter(i => v[i] === b).map(chip).join(""))).join("") + `</div></div>`;
  } else if (s.type === "padlock") {
    body = `<div class="padlock" role="group" aria-label="Combination padlock">` + v.map((d, k) => `
      <div class="dial">
        <button type="button" class="dbtn" ${dis} data-act="dial" data-r="${r.id}" data-s="${si}" data-k="${k}" data-d="1" aria-label="Increase digit ${k + 1}">▲</button>
        <span class="dig" aria-live="polite">${d}</span>
        <button type="button" class="dbtn" ${dis} data-act="dial" data-r="${r.id}" data-s="${si}" data-k="${k}" data-d="-1" aria-label="Decrease digit ${k + 1}">▼</button>
      </div>`).join("") + `</div>`;
  } else if (s.type === "cloze") {
    body = `<p class="cloze">` + s.text.replace(/\n/g, "<br>").replace(/\{(\d+)\}/g, (m, k) =>
      `<select ${dis} data-act="cloze" data-r="${r.id}" data-s="${si}" data-k="${k}" aria-label="Blank ${+k + 1}"><option value="">…</option>` +
      s.blanks[k].options.map((o, i) => `<option value="${i}" ${v[k] === i ? "selected" : ""}>${o}</option>`).join("") + `</select>`) + `</p>`;
  } else if (s.type === "text") {
    body = `<input id="t-${r.id}-${si}" class="textin" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="${s.placeholder || "Type your answer"}" aria-label="Your answer" ${dis} value="${esc(v)}" data-act="text" data-r="${r.id}" data-s="${si}">`;
  } else if (s.type === "num") {
    body = s.fields.map((f, k) => `
      <div class="row"><label for="n-${r.id}-${si}-${k}">${f.label}</label>
        <input id="n-${r.id}-${si}-${k}" type="number" inputmode="decimal" ${dis} value="${v[k]}" data-act="num" data-r="${r.id}" data-s="${si}" data-k="${k}"></div>`).join("");
  }
  const note = solved || res === true ? `<p class="stage-note">Correct</p>` : res === false ? `<p class="stage-note">Not quite. Look at this one again.</p>` : "";
  let audio = "";
  if (s.audio) {
    const busy = SPEAK_STATE !== "idle";
    const control = TTS
      ? (busy
        ? `<button type="button" class="btn ghost" data-act="stop-q" data-r="${r.id}" data-s="${si}">■ Stop</button>`
        : `<button type="button" class="btn ribbon" data-act="play-q" data-r="${r.id}" data-s="${si}">${s.audioLabel || "▶ Play Mr A’s question"}</button>`)
      : `<p class="notice" style="margin:0">Audio is not available in this view, so read the transcript below.</p>`;
    audio = `<div class="audioq">${control}<details ${TTS ? "" : "open"}><summary>Show transcript</summary><p>“${esc(s.audio)}”</p></details></div>`;
  }
  const resetBtn = solved ? "" : `<div class="resetrow"><button type="button" class="linkbtn" data-act="reset-stage" data-r="${r.id}" data-s="${si}">Reset this puzzle</button></div>`;
  return `<div class="stage ${cls}" id="stage-${si}"><h3>${s.q}</h3>${audio}${s.pre || ""}${body}${note}${resetBtn}</div>`;
}

function clueHTML(r) {
  const i = st.clue[r.id];
  if (i === undefined) return `<div class="clue empty" id="clue"><p>Tap an object to inspect it.</p></div>`;
  const o = r.objects[i];
  const body = o.html ? o.html : `<p><strong>${o.label}:</strong> ${o.text}</p>`;
  const fig = o.figure === "candida" ? candidaHTML() : "";
  return `<div class="clue" id="clue" role="status">${body}${fig}</div>`;
}
function hintsHTML(r) {
  const n = st.hintsShown[r.id] || 0;
  const shown = r.hints.slice(0, n).map((h, k) => `<div class="hint"><strong>Hint ${k + 1}:</strong> ${h}</div>`).join("");
  const more = n < r.hints.length && !st.solved[r.id]
    ? `<button type="button" class="btn ghost" data-act="hint" data-r="${r.id}">${n === 0 ? "Show a hint" : "Show another hint"}</button>` : "";
  return `<div class="hints" id="hints">${shown}${more}</div>`;
}

function roomView(r) {
  const solved = !!st.solved[r.id];
  const nextRoom = ROOMS.find(x => x.id === r.id + 1);
  const tiles = r.objects.map((o, i) => `
    <button type="button" class="tile ${st.clue[r.id] === i ? "on" : ""} ${st.seen[r.id] && st.seen[r.id][i] ? "seen" : ""}" data-act="clue" data-r="${r.id}" data-i="${i}">
      <span class="em" aria-hidden="true">${o.icon}</span><span class="lab">${o.label}</span></button>`).join("");
  const stages = r.stages.map((_, i) => stageHTML(r, i)).join("");
  const win = solved ? `
    <div class="panel" id="solvedpanel">
      <div class="solved-box">
        <div class="win-letter" aria-label="Character ${r.letter}">${r.letter}</div>
        <div class="txt">
          <span class="badge">Room solved</span>
          <p><strong>Character ${r.pos} of 8 is ${r.letter}.</strong> It is now in your rack at the top of the screen.</p>
          ${r.teaching ? `<p>${r.teaching}</p>` : ""}
          ${r.teachingExtra || ""}
        </div>
      </div>
      <div class="actions">${nextRoom ? `<button type="button" class="btn ribbon" data-act="open" data-r="${nextRoom.id}">On to room ${nextRoom.id}: ${nextRoom.name}</button>` : `<button type="button" class="btn ribbon" data-act="door">Go to the final door</button>`}<button type="button" class="btn ghost" data-act="hub">Back to the corridor</button></div>
    </div>` : "";
  return `
    <div class="crumb"><button type="button" class="btn ghost" data-act="hub">Back to the corridor</button></div>
    ${st.review ? `<div class="reviewbar"><strong>Review mode</strong><button type="button" class="btn" data-act="rev-show" data-r="${r.id}">Show correct answers</button><button type="button" class="btn ghost" data-act="rev-reset" data-r="${r.id}">Reset this room</button></div>` : ""}
    <div class="room-head">
      <span class="plate" aria-hidden="true">${r.id}</span>
      <div><h2>${r.name}</h2>${r.sub ? `<p class="sub">${r.sub}</p>` : ""}</div>
    </div>
    ${win}
    <div class="panel">
      <p>${r.intro}</p>
      ${r.figure === "cxr" ? xrayHTML() : ""}
      ${r.link ? `<p><a href="${r.link.href}" target="_blank" rel="noopener noreferrer">${r.link.text}</a></p>` : ""}
      <h3>Search the room</h3>
      <div class="tiles">${tiles}</div>
      ${clueHTML(r)}
    </div>
    ${recordingPanelHTML(r)}
    <div class="panel">
      <h3>The lock</h3>
      <div id="stages">${stages}</div>
      ${solved ? "" : `<div class="actions"><button type="button" class="btn ribbon" data-act="check" data-r="${r.id}">Try the lock</button></div>
      <p class="fb ${st.msg[r.id] ? "bad" : ""}" id="fb" role="status">${st.msg[r.id] || ""}</p>`}
      ${hintsHTML(r)}
    </div>`;
}

function doorView() {
  const letters = ROOMS.slice().sort((a, b) => a.pos - b.pos)
    .map(r => `<div class="ltile"><b>${r.letter}</b><span>Character ${r.pos}</span></div>`).join("");
  return `
    <div class="crumb"><button type="button" class="btn ghost" data-act="hub">Back to the corridor</button></div>
    <h2>The final door</h2>
    <p>Know the facts. Challenge the stigma. Treat the person. World AIDS Day 2026: Ending AIDS starts with ______. Then add the last two digits of the year by which the world aims to end AIDS as a public health threat. Put the eight characters in position order to make the override code.</p>
    <div class="letters">${letters}</div>
    <div class="actions">
      <input class="codein" id="code" type="text" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Override code" value="">
      <button type="button" class="btn ribbon" data-act="unlock">Unlock</button>
      ${st.review ? `<button type="button" class="btn ghost" data-act="rev-word">Fill in the word</button>` : ""}
    </div>
    <p class="fb ${st.doorMsg ? "bad" : ""}" id="fb" role="status">${st.doorMsg}</p>`;
}

function winView() {
  const debrief = ROOMS.map(r => `<details><summary>Room ${r.id}: ${r.name}</summary>${r.teaching ? `<p>${r.teaching}</p>` : ""}${r.teachingExtra || ""}</details>`).join("");
  return `
    <div class="signboard">
      <h1>Door open: you escaped!</h1>
      <p>The override code was <strong>${FINAL_WORD}</strong>. World AIDS Day 2026 says ending AIDS starts with access, and the world aims to end AIDS as a public health threat by 2030. You escaped the myths, Mr A escaped the hospital, and he is back to living his life.</p>
      <p><strong>World AIDS Day, 1 December 2026: Ending AIDS starts with access.</strong> Know the facts. Challenge the stigma. Treat the person.</p>
    </div>
    <div class="stat-row">
      <div class="stat"><b>${fmt(st.elapsed)}</b>Escape time</div>
      <div class="stat"><b>${st.hints}</b>Hints used</div>
      <div class="stat"><b>${st.attempts}</b>Lock attempts</div>
    </div>
    <h2>Your results</h2>
    ${resultsHTML()}
    <h2>Debrief</h2>
    <p>Open each room to revisit its teaching point. Mr A’s shingles eight months earlier was a missed chance to test. Testing, treatment and prevention only reach everyone when stigma is tackled too.</p>
    ${debrief}
    <div class="actions"><button type="button" class="btn" data-act="again">Play again</button></div>`;
}

function buildResults() {
  let prev = 0;
  const rooms = ROOMS.slice().sort((a, b) => a.id - b.id).map(r => {
    const done = st.roomDone[r.id];
    const secs = done === undefined ? null : Math.max(0, done - prev);
    if (done !== undefined) prev = done;
    return { room: r.id, name: r.name, seconds: secs, wrong: st.wrong[r.id] || 0, resets: st.resets[r.id] || 0, hints: st.hintsShown[r.id] || 0 };
  });
  return { game: "WAD2026", team: st.team || "(no team name)", total_seconds: st.elapsed, hints: st.hints, lock_attempts: st.attempts,
           wrong_parts: rooms.reduce((n, x) => n + x.wrong, 0), rooms: rooms };
}
function resultsText(res) {
  const lines = ["World AIDS Day escape room: " + res.team,
    "Escape time " + fmt(res.total_seconds) + ", hints " + res.hints + ", wrong parts " + res.wrong_parts];
  res.rooms.forEach(x => lines.push("Room " + x.room + " " + x.name + ": " + (x.seconds === null ? "-" : fmt(x.seconds)) + ", wrong " + x.wrong + ", hints " + x.hints));
  return lines.join("\n");
}
function resultsHTML() {
  const res = buildResults();
  const rows = res.rooms.map(x => `<tr><td>${x.room}. ${x.name}</td><td>${x.seconds === null ? "-" : fmt(x.seconds)}</td><td>${x.wrong}</td><td>${x.hints}</td></tr>`).join("");
  return `<p><strong>${esc(res.team)}</strong></p>
    <div class="scroll"><table class="labs"><thead><tr><th>Room</th><th>Time</th><th>Wrong parts</th><th>Hints</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="notice">Wrong parts counts each part of a lock that was marked wrong when you tried it.</p>
    <textarea class="resultsbox" id="resultsbox" readonly rows="6" aria-label="Your results as text">${esc(resultsText(res))}</textarea>
    <div class="actions">${RESULTS_FORM_URL ? `<button type="button" class="btn ribbon" data-act="submit-form">Submit your result</button> ` : ""}<button type="button" class="btn" data-act="copy-results">Copy results</button> <span id="copymsg" class="notice" role="status"></span></div>
    <p class="notice" id="sentmsg">${RESULTS_ENDPOINT ? (st.sent || "Sending your team's result (team name, times, hints and mistakes) to the organiser.") : (RESULTS_FORM_URL ? "Press Submit your result. It opens a form with your results already filled in. Check it, then press Submit on the form." : "Copy your results and paste them into the Teams chat or the form your facilitator gives you.")}</p>`;
}
function copyResults() {
  const box = document.getElementById("resultsbox");
  const msg = document.getElementById("copymsg");
  if (!box) return;
  const done = ok => { if (msg) msg.textContent = ok ? "Copied." : "Select the text and copy it."; };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(box.value).then(() => done(true), () => { box.select(); done(false); });
  else { box.select(); try { done(document.execCommand("copy")); } catch (e) { done(false); } }
}
function submitForm() {
  if (!RESULTS_FORM_URL) return;
  const res = buildResults();
  const val = {
    team: res.team, time: fmt(res.total_seconds), seconds: String(res.total_seconds), hints: String(res.hints),
    wrong: String(res.wrong_parts), attempts: String(res.lock_attempts), details: resultsText(res)
  };
  const url = RESULTS_FORM_URL.replace(/\{\{(\w+)\}\}/g, (m, k) => encodeURIComponent(val[k] !== undefined ? val[k] : ""));
  window.open(url, "_blank", "noopener");
}
function sendResults() {
  if (!RESULTS_ENDPOINT) return;
  try {
    fetch(RESULTS_ENDPOINT, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(buildResults()) })
      .then(() => { st.sent = "Your team's result has been sent to the organiser."; const m = document.getElementById("sentmsg"); if (m) m.textContent = st.sent; })
      .catch(() => { st.sent = "The result could not be sent. Please copy it and paste it into the Teams chat."; const m = document.getElementById("sentmsg"); if (m) m.textContent = st.sent; });
  } catch (e) { /* ignore */ }
}

function render() {
  let html = "";
  if (st.screen === "intro") html = introView();
  else if (st.screen === "hub") html = hubView();
  else if (st.screen === "room") html = roomView(roomById(st.roomId));
  else if (st.screen === "door") html = doorView();
  else if (st.screen === "win") html = winView();
  app.innerHTML = html;
  if (st.started) updateHeader();
}
function go(screen, roomId) {
  st.hold = null;
  if (screen === "room" && !isUnlocked(roomId)) { screen = "hub"; roomId = null; }
  st.screen = screen;
  st.roomId = roomId || null;
  render();
  window.scrollTo(0, 0);
  app.focus({ preventScroll: true });
}

/* ---------- Partial refreshes ---------- */
function refreshStage(rid, si, focusSel) {
  const r = roomById(rid);
  const el = document.getElementById("stage-" + si);
  if (!el) return;
  el.outerHTML = stageHTML(r, si);
  if (focusSel) {
    const f = document.querySelector(focusSel);
    if (f) f.focus({ preventScroll: true });
  }
}

/* ---------- Actions ---------- */
function checkRoom(rid) {
  const r = roomById(rid);
  st.attempts++;
  const results = r.stages.map((s, i) => checkStage(s, getVal(rid, i, s)));
  st.res[rid] = results;
  const good = results.filter(Boolean).length;
  st.wrong[rid] = (st.wrong[rid] || 0) + (results.length - good);
  if (good === results.length) {
    st.solved[rid] = true;
    if (st.roomDone[rid] === undefined) st.roomDone[rid] = Math.floor((Date.now() - st.startTime) / 1000);
    st.msg[rid] = "";
    render();
    const p = document.getElementById("solvedpanel");
    if (p) p.scrollIntoView({ behavior: "smooth", block: "start" });
  } else {
    st.msg[rid] = good + " of " + results.length + " parts correct. The parts outlined in red need another look.";
    r.stages.forEach((_, i) => refreshStage(rid, i));
    const fb = document.getElementById("fb");
    fb.textContent = st.msg[rid];
    fb.className = "fb bad";
  }
}

function unlock() {
  const input = document.getElementById("code");
  const v = (input.value || "").trim().toUpperCase();
  st.attempts++;
  if (v === FINAL_WORD) {
    st.finished = true;
    st.elapsed = Math.floor((Date.now() - st.startTime) / 1000);
    clearInterval(timerId);
    document.getElementById("timer").textContent = fmt(st.elapsed);
    go("win");
    sendResults();
  } else {
    st.doorMsg = v.length < 8 ? "The override code has 8 characters." : "ACCESS DENIED. Something isn’t right. Go back and check the characters in position order, 1 to 8.";
    const fb = document.getElementById("fb");
    fb.textContent = st.doorMsg;
    fb.className = "fb bad";
    input.focus();
  }
}

function showKey() {
  const items = ROOMS.map(r => `<li><strong>Room ${r.id}, ${r.name} (character ${r.pos}: ${r.letter}).</strong> ${r.key}</li>`).join("");
  const m = document.getElementById("modal");
  m.innerHTML = `<div class="modal"><h2 id="modal-title">Facilitator answer key</h2>
    <p>Final code: <strong>${FINAL_WORD}</strong>. Characters by position: ${ROOMS.slice().sort((a, b) => a.pos - b.pos).map(r => r.letter).join(", ")}.</p>
    <ol>${items}</ol>
    <div class="actions"><button type="button" class="btn" data-act="closekey" id="closekey">Close</button></div></div>`;
  m.classList.remove("hidden");
  document.getElementById("closekey").focus();
}
function hideKey() { document.getElementById("modal").classList.add("hidden"); }

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const act = t.dataset.act;
  const rid = t.dataset.r ? +t.dataset.r : null;
  const si = t.dataset.s !== undefined ? +t.dataset.s : null;
  const i = t.dataset.i !== undefined ? +t.dataset.i : null;
  const sel = (a) => `[data-act="${a}"][data-r="${rid}"][data-s="${si}"][data-i="${i}"]`;

  switch (act) {
    case "begin": {
      const tn = document.getElementById("teamname");
      st.team = tn ? tn.value.trim().slice(0, 30) : "";
      const te = document.getElementById("teamerr");
      if (REQUIRE_TEAM && !st.team) { if (te) te.textContent = "Please enter a team name first."; if (tn) tn.focus(); break; }
      if (st.team.indexOf("@") >= 0) { if (te) te.textContent = "Please use a team name, not an email address."; if (tn) tn.focus(); break; }
      startTimer(); go("hub"); break;
    }
    case "hub": go("hub"); break;
    case "open": if (isUnlocked(rid)) go("room", rid); break;
    case "door": go("door"); break;
    case "unlock": unlock(); break;
    case "again": clearInterval(timerId); resetState(); document.getElementById("stats").classList.add("hidden"); go("intro"); break;
    case "key": if (!FACILITATOR) break; showKey(); break;
    case "review": if (!FACILITATOR) break; st.review = true; if (!st.started) startTimer(); go("hub"); break;
    case "rev-show": {
      if (!st.review) break;
      const r = roomById(rid);
      r.stages.forEach((stg, k) => setVal(rid, k, correctValue(stg)));
      st.res[rid] = r.stages.map(() => true);
      st.msg[rid] = "";
      st.solved[rid] = true;
      st.hold = null;
      render();
      updateHeader();
      break;
    }
    case "rev-reset": {
      if (!st.review) break;
      delete st.inp[rid]; delete st.res[rid]; delete st.msg[rid]; delete st.solved[rid];
      st.hold = null;
      render();
      updateHeader();
      break;
    }
    case "rev-word": {
      if (!st.review) break;
      const inp = document.getElementById("code");
      if (inp) inp.value = FINAL_WORD;
      break;
    }
    case "comment": {
      if (!COMMENTS) break;
      const target = document.querySelector("#app .room-head") || document.querySelector("#app h2") || document.querySelector("#app h1") || app;
      COMMENTS.openComposer({ element: target }).catch(err => {
        if (err && ["unavailable", "not_granted", "forbidden"].includes(err.code)) {
          COMMENTS = null;
          document.getElementById("cbtn").classList.add("hidden");
        }
      });
      break;
    }
    case "closekey": hideKey(); break;
    case "clue": {
      st.clue[rid] = i;
      (st.seen[rid] || (st.seen[rid] = {}))[i] = true;
      const r = roomById(rid);
      document.getElementById("clue").outerHTML = clueHTML(r);
      document.querySelectorAll(".tile").forEach((b, k) => {
        b.classList.toggle("on", k === i);
        if (k === i) b.classList.add("seen");
      });
      break;
    }
    case "hint": {
      const r = roomById(rid);
      st.hintsShown[rid] = (st.hintsShown[rid] || 0) + 1;
      st.hints++;
      document.getElementById("hints").outerHTML = hintsHTML(r);
      updateHeader();
      break;
    }
    case "check": checkRoom(rid); break;
    case "reset-stage": {
      if (st.solved[rid]) break;
      if (st.inp[rid]) delete st.inp[rid][si];
      if (st.res[rid]) st.res[rid][si] = null;
      st.resets[rid] = (st.resets[rid] || 0) + 1;
      st.hold = null;
      if (st.res[rid] && !st.res[rid].some(x => x === false)) st.msg[rid] = "";
      refreshStage(rid, si);
      const fbEl = document.getElementById("fb");
      if (fbEl) { fbEl.textContent = st.msg[rid] || ""; fbEl.className = "fb " + (st.msg[rid] ? "bad" : ""); }
      break;
    }
    case "copy-results": copyResults(); break;
    case "submit-form": submitForm(); break;
    case "play-rec": playRecording(); break;
    case "play-q": {
      const stg = roomById(rid).stages[si];
      if (TTS && stg.audioSrc) TTS.speak(stg.audioSrc).catch(() => {});
      break;
    }
    case "stop-q": stopRecording(); break;
    case "stop-rec": stopRecording(); break;
    case "mcq": {
      setVal(rid, si, i);
      refreshStage(rid, si, sel("mcq"));
      break;
    }
    case "multi": {
      const s = roomById(rid).stages[si];
      const v = getVal(rid, si, s);
      const k = v.indexOf(i);
      if (k >= 0) v.splice(k, 1); else v.push(i);
      refreshStage(rid, si, sel("multi"));
      break;
    }
    case "ord-add": {
      const s = roomById(rid).stages[si];
      getVal(rid, si, s).push(i);
      refreshStage(rid, si);
      break;
    }
    case "spot": {
      const s = roomById(rid).stages[si];
      const v = getVal(rid, si, s);
      const k = v.indexOf(i);
      if (k >= 0) v.splice(k, 1); else v.push(i);
      refreshStage(rid, si, sel("spot"));
      break;
    }
    case "deck": {
      const s = roomById(rid).stages[si];
      getVal(rid, si, s)[+t.dataset.k] = +t.dataset.b;
      refreshStage(rid, si, `[data-act="deck"][data-r="${rid}"][data-s="${si}"][data-b="0"]`);
      break;
    }
    case "deck-undo": {
      const s = roomById(rid).stages[si];
      getVal(rid, si, s)[+t.dataset.k] = null;
      refreshStage(rid, si, `[data-act="deck"][data-r="${rid}"][data-s="${si}"][data-b="0"]`);
      break;
    }
    case "sort-pick": {
      const same = st.hold && st.hold.r === rid && st.hold.s === si && st.hold.i === i;
      st.hold = same ? null : { r: rid, s: si, i };
      refreshStage(rid, si, `[data-act="sort-pick"][data-r="${rid}"][data-s="${si}"][data-i="${i}"]`);
      break;
    }
    case "sort-drop": {
      if (!st.hold || st.hold.r !== rid || st.hold.s !== si) break;
      placeSortItem(rid, si, st.hold.i, +t.dataset.b);
      st.hold = null;
      refreshStage(rid, si);
      break;
    }
    case "dial": {
      const s = roomById(rid).stages[si];
      const k = +t.dataset.k, d = +t.dataset.d;
      const v = getVal(rid, si, s);
      v[k] = (((v[k] + d) % 10) + 10) % 10;
      refreshStage(rid, si, `[data-act="dial"][data-r="${rid}"][data-s="${si}"][data-k="${k}"][data-d="${d}"]`);
      break;
    }
    case "ord-undo": {
      const s = roomById(rid).stages[si];
      getVal(rid, si, s).pop();
      refreshStage(rid, si);
      break;
    }
    case "ord-reset": {
      setVal(rid, si, []);
      refreshStage(rid, si);
      break;
    }
  }
});

document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset && t.dataset.act === "cloze") {
    const rid = +t.dataset.r, si = +t.dataset.s, k = +t.dataset.k;
    const s = roomById(rid).stages[si];
    getVal(rid, si, s)[k] = t.value === "" ? null : +t.value;
    return;
  }
  if (t.dataset && t.dataset.act === "match") {
    const rid = +t.dataset.r, si = +t.dataset.s, k = +t.dataset.k;
    const s = roomById(rid).stages[si];
    getVal(rid, si, s)[k] = t.value === "" ? null : +t.value;
  }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset && t.dataset.act === "text") {
    setVal(+t.dataset.r, +t.dataset.s, t.value);
    return;
  }
  if (t.dataset && t.dataset.act === "num") {
    const rid = +t.dataset.r, si = +t.dataset.s, k = +t.dataset.k;
    const s = roomById(rid).stages[si];
    getVal(rid, si, s)[k] = t.value;
  }
});
function correctValue(s) {
  switch (s.type) {
    case "mcq": return s.answer;
    case "multi": return s.answers.slice();
    case "match": return s.rows.map(r => r.answer);
    case "order": return s.items.map((_, k) => k);
    case "spot": return s.items.map((it, k) => (it.problem ? k : -1)).filter(k => k >= 0);
    case "text": return s.reveal || (s.mustInclude || []).join(" ");
    case "num": return s.fields.map(f => String(f.answer));
    case "sort": case "deck": return s.items.map(it => it.bin);
    case "padlock": return String(s.answer).split("").map(Number);
    case "cloze": return s.blanks.map(b => b.answer);
  }
  return null;
}
function placeSortItem(rid, si, i, b) {
  const stage = roomById(rid).stages[si];
  getVal(rid, si, stage)[i] = b < 0 ? null : b;
}
document.addEventListener("dragstart", e => {
  const t = e.target.closest && e.target.closest('[data-act="sort-pick"]');
  if (!t || t.disabled) return;
  e.dataTransfer.setData("text/plain", [t.dataset.r, t.dataset.s, t.dataset.i].join(","));
  e.dataTransfer.effectAllowed = "move";
});
document.addEventListener("dragover", e => {
  const z = e.target.closest && e.target.closest('[data-act="sort-drop"]');
  if (z) e.preventDefault();
});
document.addEventListener("drop", e => {
  const z = e.target.closest && e.target.closest('[data-act="sort-drop"]');
  if (!z) return;
  e.preventDefault();
  const [r, sx, i] = (e.dataTransfer.getData("text/plain") || "").split(",").map(Number);
  if (isNaN(i) || r !== +z.dataset.r || sx !== +z.dataset.s || st.solved[r]) return;
  placeSortItem(r, sx, i, +z.dataset.b);
  st.hold = null;
  refreshStage(r, sx);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") hideKey();
  if (e.key === "Enter" && e.target && e.target.id === "code") unlock();
});

resetState();
render();

/* ---------- Audio: plays the recorded clips output1.mp3, output2.mp3 and output3.mp3 inline ---------- */
function initAudio() {
  const listeners = [];
  const emit = state => listeners.forEach(f => f({ state: state }));
  let current = null;
  const stopAll = () => { if (current) { try { current.pause(); current.currentTime = 0; } catch (e) { /* ignore */ } current = null; } };
  TTS = {
    speak(src) {
      return new Promise(resolve => {
        stopAll();
        if (!src) { emit("idle"); resolve(); return; }
        const a = new Audio(src);
        current = a;
        const finish = () => { if (current === a) { current = null; emit("idle"); } resolve(); };
        a.onplay = () => { if (current === a) emit("speaking"); };
        a.onended = finish;
        a.onerror = finish;
        const pr = a.play();
        if (pr && pr.catch) pr.catch(finish);
      });
    },
    stop() { stopAll(); emit("idle"); return Promise.resolve(); },
    onState(f) { listeners.push(f); return () => {}; }
  };
  TTS.onState(e => {
    SPEAK_STATE = e.state;
    refreshRecording();
    if (st.screen === "room") {
      const rm = roomById(st.roomId);
      rm.stages.forEach((stg, k) => { if (stg.audio) refreshStage(rm.id, k); });
    }
  });
  refreshRecording();
  if (st.screen === "room") {
    const rm = roomById(st.roomId);
    rm.stages.forEach((stg, k) => { if (stg.audio) refreshStage(rm.id, k); });
  }
}
initAudio();
</script>
